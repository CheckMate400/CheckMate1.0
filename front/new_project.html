<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>צור פרויקט בדיקה חדש</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }
    input, select {
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }
    label {
      display: block;
      margin-top: 20px;
    }
    button {
      margin-top: 30px;
      padding: 12px 24px;
      background-color: #00cc66;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }
    th, td {
      border: 1px solid #444;
      padding: 10px;
    }
    th {
      background-color: #333;
    }
    td {
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🎓 צור פרויקט בדיקת מבחנים</h1>

  <form id="projectForm">
    <label>שם הפרויקט:</label>
    <input type="text" name="project_name" required>

    <label>נושא (למשל: פיזיקה, מתמטיקה):</label>
    <input type="text" name="subject" required>

    <label>מספר שאלות:</label>
    <input type="number" name="num_questions" min="1" required>

    <label>קובץ פתרונות (אופציונלי):</label>
    <input type="file" name="solution_file" accept=".pdf,.txt">

    <label>מספר מבחנים לבדיקה:</label>
    <input type="number" name="num_tests" min="1" required>

    <label>קבצי מבחנים (בחר כמה):</label>
    <input type="file" name="test_files" accept=".pdf" multiple required>

    <label>ממוצע צפוי (אופציונלי):</label>
    <input type="number" name="expected_average" min="1" max="100">

    <button type="submit">צור והעלה פרויקט</button>
  </form>

  <a href="index.html" class="button">חזרה לעמוד הבית</a>

  <div id="response" style="margin-top: 30px;"></div>

  <script>
    const form = document.getElementById('projectForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();

      formData.append("project_name", form.project_name.value.trim());
      formData.append("subject", form.subject.value.trim());
      formData.append("num_questions", form.num_questions.value);
      formData.append("num_tests", form.num_tests.value);
      if (form.expected_average.value) {
        formData.append("expected_average", form.expected_average.value);
      }

      const solutionFile = form.solution_file.files[0];
      if (solutionFile) {
        formData.append("solution_file", solutionFile);
      }

      for (let file of form.test_files.files) {
        formData.append("test_files", file);
      }

      const responseBox = document.getElementById("response");
      responseBox.innerText = "⏳ מעלה ובודק את הפרויקט...";

      try {
        const res = await fetch("http://localhost:8000/create_project/", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        let html = `<h3>✅ הפרויקט "${data.project_name}" הועלה בהצלחה</h3>`;
        html += `<p>מספר מבחנים: ${data.num_tests}</p>`;
        if (data.average) html += `<p>ממוצע צפוי: ${data.average}</p>`;

        html += `<table>
          <tr>
            <th>שם תלמיד</th>
            <th>ציונים לכל שאלה</th>
            <th>ציון סופי</th>
          </tr>`;

        data.results.forEach(student => {
          const gradesList = student.grades.map(q => `ש${q.question_number}: ${q.grade}`).join(" | ");
          html += `
            <tr>
              <td>${student.student}</td>
              <td>${gradesList}</td>
              <td><strong>${student.overall_score}</strong></td>
            </tr>`;
        });

        html += `</table>`;
        responseBox.innerHTML = html;

      } catch (err) {
        console.error(err);
        responseBox.innerHTML = "<p style='color:red;'>❌ שגיאה בהעלאת הפרויקט או בקריאת התוצאה.</p>";
      }
    });
  </script>

</body>
</html>
